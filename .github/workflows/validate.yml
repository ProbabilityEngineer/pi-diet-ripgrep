name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run
